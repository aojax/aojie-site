name: Deploy to Cloudflare Pages

# 兜底部署：即使 Cloudflare 的 Git webhook 断掉，
# GitHub Actions 也能独立完成构建 + 部署。
on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许在 Actions 页面手动触发

# 同一分支只保留最新一次运行，避免并发部署互相覆盖
concurrency:
  group: pages-deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # wrangler 4.x 要求 node >= 22.19
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to Cloudflare Pages
        id: deploy
        # 直接调 wrangler CLI，不用 wrangler-action：
        # 该 action 的 input 白名单不含 args，命令行参数无法透传。
        # wrangler 自动读取 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 环境变量。
        run: |
          npx --yes wrangler@latest pages deploy dist \
            --project-name=aojie-site \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="deploy-${GITHUB_RUN_NUMBER}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        run: |
          echo "### 部署完成 🎉" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production: https://aojie.space" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
